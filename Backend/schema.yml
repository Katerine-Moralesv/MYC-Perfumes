  /api/v1/catalogo/productos/:
    get:
      operationId: v1_catalogo_productos_list
      description: |-
        GET  -> Catálogo público: productos activos con precio asignado.
        POST -> Solo administrador.
        Filtros públicos: categoria, categoria_nombre y familias_olfativas
        (IDs separados por coma). No se exponen porcentajes internos.
      parameters:
      - in: query
        name: categoria
        description: ID del público objetivo.
        schema:
          type: integer
      - in: query
        name: categoria_nombre
        description: Nombre del público objetivo (Mujer, Hombre, Unisex).
        schema:
          type: string
      - in: query
        name: familias_olfativas
        description: IDs de familias olfativas separados por coma.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
          description: ''
    post:
      operationId: v1_catalogo_productos_create
      description: |-
        GET  -> Catálogo público: productos activos con precio asignado.
        POST -> Solo administrador.
      tags:
